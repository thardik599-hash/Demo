{% extends 'header.html' %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="d-flex justify-content-center align-items-center" style="height: 100vh;">
    {% block content %}
    

    <form action="" method="post" enctype="multipart/form-data" >
        {% csrf_token %}
        <div style="">
    <div style="height: 380px; width: 400px;" class="border border-success border-3 p-2 ">


       
        <h1 class="text-center">Login</h1>
        <div>
            <label for="" class="form-label" >username</label>
            <input type="text" class="form-control mb-2" placeholder="Enter Your Username" name="name">
        </div>
         <div>
            <label for="" class="form-label ">password</label>
            <input type="number" class="form-control mb-2" placeholder="Enter Your Age" name="age">
        </div>

       


      

        <div class="mt-3">
           
            <button class="btn btn-success w-100 mt-3 " >login</button>
        </div>


    </div>


</form>

<table class="table table-bordered table-danger table-striped">
        <tr>
            <th>Name</th>
            <th>age</th>
            <th>delete </th>
            <th>update</th>
            
        </tr>
        {% for form in  form  %}
        <tr>
        </tr>
  
        
        <tr>
            <td>{{form.name}}</td>
             <td>{{form.age}}</td>
             <td><a href="{% url 'delete_Student' form.id %}" class="btn btn-danger" > delete Student</a></td>
             <td><a href="{% url 'update' form.id %}" class="btn btn-danger" > update</a></td>
           
             
        </tr>
        
        {% endfor %}
    </table>    
    </div>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    {% endblock %}
</body>
</html>
